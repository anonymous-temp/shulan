<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Shulan 服务健康检查 API Lab</title>
        <link rel="stylesheet" href="./common.css">
    </head>
    <body>
        <main class="shell lab-shell">
            <header class="topbar">
                <div>
                    <p class="eyebrow">Live API laboratory</p>
                    <h1>服务健康检查</h1>
                    <p class="subtitle">检查服务、存活与就绪状态。就绪检查可能返回 HTTP 503，完整响应会保留在结果区。</p>
                </div>
            </header>
            <nav class="nav-links lab-nav" aria-label="接口页面">
                <a class="nav-link" href="./index.html"><span>全部接口</span></a>
                <a class="nav-link active" aria-current="page" href="./health.html"><span>健康检查</span><small lang="en">Health Check</small></a>
                <a class="nav-link" href="./interpret.html"><span>报告解读</span><small lang="en">Analysis</small></a>
                <a class="nav-link" href="./record.html"><span>建档问答</span><small lang="en">Record</small></a>
                <a class="nav-link" href="./chat.html"><span>智能对话</span><small lang="en">Chat</small></a>
                <a class="nav-link" href="./record-preview.html"><span>整卷问卷</span><small lang="en">Questionnaire</small></a>
                <a class="nav-link" href="./health-analysis.html"><span>健康分析</span><small lang="en">Health Analysis</small></a>
                <a class="nav-link" href="./report.html"><span>最终报告</span><small lang="en">Report</small></a>
                <a class="nav-link" href="./health-profile.html"><span>健康画像</span><small lang="en">Profile</small></a>
                <a class="nav-link" href="./health-profile-view.html"><span>画像展示</span><small lang="en">Profile View</small></a>
            </nav>
            <section id="lab-context" data-lab-section="连接与身份" class="connection lab-context" aria-label="公共测试设置">
            </section>
            <div class="lab-workspace">
                <div class="lab-main">
                    <section id="api-editor" data-lab-section="请求编辑" class="panel">
                    </section>
                    <section class="panel" id="lab-response" data-lab-section="响应 JSON">
                        <div class="panel-head">
                            <h2>接口结果</h2>
                        </div>
                        <div id="api-result" class="result-json" aria-live="polite">尚未发送请求。</div>
                    </section>
                </div>
                <details class="panel lab-log" id="lab-network-log" data-lab-section="网络记录">
                    <summary class="lab-disclosure">原始网络记录</summary>
                    <div class="panel-head">
                        <button id="clear-log" class="button ghost">清空</button>
                    </div>
                    <pre id="raw-log" class="log">
                    </pre>
                </details>
            </div>
        </main>
        <script src="./lab-core.js">
        </script>
        <script src="./api-contracts.js">
        </script>
        <script src="./json-viewer.js"></script>
        <script src="./common.js">
        </script>
        <script>ApiLab.initialize({group: "health"});</script>
    </body>
</html>
